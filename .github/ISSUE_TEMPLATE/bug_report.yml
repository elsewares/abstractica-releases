name: Bug report
description: Something in Abstractica isn't working right
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Questions and feature ideas go in
        [Discussions](https://github.com/elsewares/abstractica-releases/discussions);
        security problems go through [private reporting](https://github.com/elsewares/abstractica-releases/security/advisories/new);
        license and billing problems go to **hello@elsewares.io**.

        **Issues are public.** Please don't paste journal text, character details, or your license key.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched [existing issues](https://github.com/elsewares/abstractica-releases/issues?q=is%3Aissue) and this hasn't been reported.
          required: true
        - label: I'm on the [latest release](https://github.com/elsewares/abstractica-releases/releases/latest), or I've noted below why I can't update.
  - type: input
    id: version
    attributes:
      label: Abstractica version
      description: Shown in the About dialog.
      placeholder: e.g. 0.9.25
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux (x64)
        - Linux (arm64)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.5, Windows 11 24H2, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: How did you install it?
      options:
        - macOS .dmg
        - Windows setup .exe
        - Linux .deb
        - Linux .rpm
        - Linux .AppImage
  - type: dropdown
    id: area
    attributes:
      label: Which part of Abstractica?
      options:
        - Chronicle editor / slash commands
        - Oracles & tables
        - Moves & dice
        - Generators
        - Clocks & progress tracks
        - Character sheet / assets
        - Entities
        - Campaigns, files & data
        - License & activation
        - Installing or updating
        - Something else
    validations:
      required: true
  - type: dropdown
    id: game-system
    attributes:
      label: Game system in use
      options:
        - Not specific to a game system
        - "Ironsworn"
        - "Ironsworn: Delve"
        - "Ironsworn: Starforged"
        - Sundered Isles
        - Mörk Borg
        - Abstractica (sandbox)
        - Custom / other
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a campaign…
        2. Type /oracle and pick…
        3. See…
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Only once so far
  - type: textarea
    id: error-text
    attributes:
      label: Error messages
      description: If Abstractica showed an error, copy its exact wording here — or attach a screenshot below.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, a workaround you found, or whether this started after an update.
